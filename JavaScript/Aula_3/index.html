<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de média</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header>
<h1 id="titulo">Calculadora de média</h1>
</header>

<main>
<p>Digite o nome do estudante e as três notas (de 0 a 10).</p>

<div class="campo">
<label for="nome">Nome</label>
<input id="nome" type="text">
</div>

<div class="campo">
<label for="nota1">Nota 1</label>
<input id="nota1" type="number" min="0" max="10">
</div>

<div class="campo">
<label for="nota2">Nota 2</label>
<input id="nota2" type="number" min="0" max="10">
</div>

<div class="campo">
<label for="nota3">Nota 3</label>
<input id="nota3" type="number" min="0" max="10">
</div>

<button id="calcular" type="button">Calcular</button>

<p id="resultado" aria-live="polite"></p>
</main>

<footer>
<p>Desenvolvido por Luiz</p>
</footer>

<script src="script.js"></script>
</body>
</html>
