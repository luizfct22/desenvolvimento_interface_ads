<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
</head>
<body>

    <h1>Calculadora de Média</h1>

    <label for="nota1">Nota 1:</label>
    <input type="number" id="nota1" min="0" max="10" step="0.1">

    <br><br>

    <label for="nota2">Nota 2:</label>
    <input type="number" id="nota2" min="0" max="10" step="0.1">

    <br><br>

    <label for="nota3">Nota 3:</label>
    <input type="number" id="nota3" min="0" max="10" step="0.1">

    <br><br>

    <button id="calcular">Calcular Média</button>

    <div id="resultado" aria-live="polite"></div>

    <script>
        document.getElementById("calcular").addEventListener("click", function() {

            let nota1 = document.getElementById("nota1").value;
            let nota2 = document.getElementById("nota2").value;
            let nota3 = document.getElementById("nota3").value;

            let resultado = document.getElementById("resultado");

            if (nota1 === "" || nota2 === "" || nota3 === "") {
                resultado.textContent = "Preencha todas as notas!";
                return;
            }

            nota1 = Number(nota1);
            nota2 = Number(nota2);
            nota3 = Number(nota3);

            if (
                nota1 < 0 || nota1 > 10 ||
                nota2 < 0 || nota2 > 10 ||
                nota3 < 0 || nota3 > 10
            ) {
                resultado.textContent = "As notas devem estar entre 0 e 10!";
                return;
            }

            let media = (nota1 + nota2 + nota3) / 3;

            resultado.textContent = "A média do estudante é: " + media.toFixed(2);

        });
    </script>

</body>
</html>
